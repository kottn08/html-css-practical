<!DOCTYPE html>
<html>
    <head>
        <title>My Profile</title>
        <meta charset="UTF-8">
        <meta name="description" content="朝比奈 一樹 25歳 長野県佐久市出身。ソフトウェア業界でマーケティングに従事。趣味はカメラで愛機はCanon。自然を撮影するのが好きでよく海や山に行きます。">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../kadai_001/css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Noto+Sans+JP&display=swap" rel="stylesheet">
    </head>

    <body>
        <header>
            <div class="header-top">
            <h1>
                <a href="index.html" class="home">My Profile</a>
            </h1> 
             <nav>
              <ul class="menu">
                 <li><a href="#about">About</a></li>
                 <li><a href="#works">Works</a></li>
              </ul>
             </nav>
            </div>
        </header>

        <main>
            <article>
                <div>
                    <img class="main-visual" src="../kadai_001/images/main.png" alt="カメラの画像">
                </div>

                <section class="about">
                    <h2 id="about">About</h2>
                    <div class="about-flex">
                        <img class="about-photo" src="../kadai_001/images/about.png" alt="Kazuki Asahinaのプロフィール画像">
                        <div class="content">
                            <p class="name">Kazuki Asahina</p>
                            <ul>
                                <li>25歳 長野県佐久市出身</li>
                                <li>ソフトウェア業界でマーケティングに従事</li>
                                <li>趣味はカメラ、愛機はCanon</li>
                                <li>自然を撮影するのが好きで、海や山によく行く</li>
                            </ul>
                        </div>
                    </div>
                </section>

                <section class="works">
                    <h2 id="works">Works</h2>
                    <div class="works-flex">
                            <div class="item">
                                <img class="works-photo" src="../kadai_001/images/works1.png" alt="新潟で撮影した日本海の写真">
                                <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した1枚</p>
                            </div>
                            <div class="item">
                                <img class="works-photo" src="../kadai_001/images/works2.png" alt="長野で撮影した御嶽山の写真">
                                <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
                            </div>
                            <div class="item">
                                <img class="works-photo" src="../kadai_001/images/works3.png" alt="京都で撮影した明け方の町並み写真">
                                <p>京都で撮影した、明け方の古き良き日本の町並み</p>
                            </div>
                    </div>
                </section>
            </article>
        </main>

        <footer>
            <p>&copy;MyProfile. All rights reserved.</p>
        </footer>

    </body>
</html>
